name: build

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'main'
      - 'release/*'
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        go:
          - 1.26.x
          - 1.27.x
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
          check-latest: true
      -
        name: Install Make
        if: runner.os == 'Windows'
        run: choco install make --no-progress -y
      -
        name: Test
        shell: bash
        run: make SHELL=bash test

  test-linux:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.26.x
          - 1.27.x
        target:
          - test-coverage
          - test-s3-storage
          - test-azure-storage
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      -
        name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: false
          check-latest: true
      -
        name: Test
        run: |
          make ${{ matrix.target }}
      -
        name: Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          directory: ./

  binaries:
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    permissions:
      contents: read # same as global permission
      id-token: write # to sign provenance and cache entries
    with:
      runner: ubuntu-24.04
      target: artifact-all
      output: local
      artifact-name: registry-build
      artifact-upload: true
      cache: true
      cache-mode: max
      cache-scope: registry
      sign: ${{ github.event_name != 'pull_request' }}
      set: |
        *.args.BUILDKIT_CONTEXT_KEEP_GIT_DIR=1

  binaries-finalize:
    runs-on: ubuntu-latest
    needs:
      - binaries
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.binaries.outputs.artifact-name }}
          path: /tmp/registry-output
      -
        name: Rename provenance and signatures
        run: |
          for pdir in /tmp/registry-output/*/; do
            (
              cd "$pdir"
              binname=$(find . -name '*.tar.gz')
              filename=$(basename "${binname%.tar.gz}")
              mv "provenance.json" "${filename}.provenance.json"
              if [ -f "provenance.sigstore.json" ]; then
                mv "provenance.sigstore.json" "${filename}.sigstore.json"
              fi
            )
          done
      -
        name: Move and list artifacts
        run: |
          mkdir -p ./bin
          mv /tmp/registry-output/**/* ./bin/
          tree -nh ./bin
      -
        name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: registry
          path: ./bin/*
          if-no-files-found: error

  image:
    uses: docker/github-builder/.github/workflows/bake.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    needs:
      - test
      - test-linux
    permissions:
      contents: read # same as global permission
      id-token: write # to sign attestations and cache entries
      packages: write # to push the image to GHCR
    with:
      runner: ubuntu-24.04
      setup-qemu: true
      target: image-all
      output: image
      push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
      cache: true
      cache-mode: max
      cache-scope: registry
      sbom: true
      set: |
        *.args.BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
      set-meta-labels: true
      meta-images: |
        distribution/distribution
        ghcr.io/${{ github.repository }}
      ### versioning strategy
      ### push semver tag v3.2.1 on main (default branch)
      # distribution/distribution:3.2.1
      # distribution/distribution:3.2
      # distribution/distribution:3
      # distribution/distribution:latest
      ### push semver prelease tag v3.0.0-beta.1 on main (default branch)
      # distribution/distribution:3.0.0-beta.1
      ### push on main
      # distribution/distribution:edge
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}
        type=ref,event=pr
        type=edge
      meta-labels: |
        org.opencontainers.image.title=Distribution
        org.opencontainers.image.description=The toolkit to pack, ship, store, and distribute container content
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create a draft GitHub release
    needs:
      - test
      - test-linux
      - binaries-finalize
      - image
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry
          path: ./bin
      -
        name: GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          draft: true
          files: |
            bin/*.tar.gz
            bin/*.provenance.json
            bin/*.sigstore.json
            bin/*.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
